<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marina Wiegand">
    <meta name="description" content="Web Developer Portfolio Website. Digital example of webpage">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Tenloc</title>
    <link href="./pages/index.css" rel="stylesheet" />
    <script defer src="./js/index.js"></script>
</head>
<body class="page">
    <header class="header">
        <div class="sidenav" id="burger-sidenav"> 
            <div class="sidenav__container">
                <div class="sidenav__header">
                    <a href="#" class="logo-sidenav"></a>
                    <div class="header__burger-tooltip-close">
                        <span class="header__icon-close" id="burger-sidenav-close"></span>
                    </div>
                </div>
                <div class="sidenav__action-bar">
                    <button class="button button_destinations" id="destinations-sidenav-btn" type="button">Destinations</button>
                    <button class="button button_login" type="button">Log in</button>
                </div>
                <ul class="list-country list-country_sidenav" id="list-country-sidenav">
                    <li class="list-country__item list-country__item_sidenav">Dubai</li>
                    <li class="list-country__item list-country__item_sidenav">Istanbul</li>
                    <li class="list-country__item list-country__item_sidenav">Saint Petersburg</li>
                    <li class="list-country__item list-country__item_sidenav">Karelia</li>
                    <li class="list-country__item list-country__item_sidenav">Paris</li>
                    <li class="list-country__item list-country__item_sidenav">Berlin</li>
                    <li class="list-country__item list-country__item_sidenav">Rome</li>
                </ul>
                <div class="sidenav__search-bar">
                    <button class="button button_search" type="button">Search</button>
                </div>
                <div class="sidenav__navigation-menu">
                    <a class="header__burger-tooltip-item" href="#">About</a>
                    <a class="header__burger-tooltip-item" href="#">Contact</a>
                </div>
            </div>
            <div class="sidenav__container">
                <div class="sidenav__info-section">
                    Contact us 9am - 9pm
                </div>
                <div class="sidenav__socialmedia">
                    <a class="button button_whatsapp button_link" id="whatsapp-sidenav-btn" href="#">WhatsApp</a>
                    <a class="button button_telegram button_link" href="#">Telegram</a>
                </div>
                <div class="sidenav__footer-row">
                    +1 309 863-8289
                </div>
            </div>           
        </div>
        <div class="container">
            <div class="header__wrapper">
                <div class="header__left-wrapper">
                    <div class="header__burger-wrapper">
                        <div class="header__burger" id="burger-nav"></div>
                    </div>
                    <a href="#" class="logo"></a>
                </div>               
                <nav class="header__nav header__nav_place_wrapper">
                    <div class="header__btn-wrapper">
                        <button class="button button_destinations" id="header-btn" type="button">Destinations</button>
                        <div class="header__tooltip" id="header-tooltip">
                            <ul class="list-country list-country_tooltip">
                                <li class="list-country__item list-country__item_tooltip">Dubai</li>
                                <li class="list-country__item list-country__item_tooltip">Istanbul</li>
                                <li class="list-country__item list-country__item_tooltip">Saint Petersburg</li>
                                <li class="list-country__item list-country__item_tooltip">Karelia</li>
                                <li class="list-country__item list-country__item_tooltip">Paris</li>
                                <li class="list-country__item list-country__item_tooltip">Berlin</li>
                                <li class="list-country__item list-country__item_tooltip">Rome</li>
                            </ul>
                        </div>
                    </div>
                    <a href="#" class="header__link">About</a>
                    <a href="#" class="header__link">Contact Us</a>
                </nav>
                <div class="header__right-wrapper">
                    <span class="icon-heart"></span>
                    <button class="button button_login" type="button">Log in</button>
                </div>
                
            </div>
        </div>
    </header>
  <div class="overlay" id="overlay"></div>
</body>
</html>
